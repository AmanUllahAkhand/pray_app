name: pray_app
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6  # For GetX state management and navigation
  geolocator: ^10.1.0  # For location handling
  permission_handler: ^12.0.1  # For handling permissions
  adhan: ^2.0.0+1  # For prayer time calculations (offline support)
  flutter_svg: ^2.0.17  # For SVG support
  easy_localization: ^3.0.8  # For multi-language support
  shared_preferences: ^2.5.3  # For storing user preferences like manual location
  hijri: ^3.0.0  # For Hijri date calculations (complements adhan)
  intl: ^0.19.0  # For date and time formatting
  table_calendar: ^3.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lang/en.json
    - assets/lang/bn.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500