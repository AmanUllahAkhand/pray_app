name: pray_app
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6  # For GetX state management and navigation
  geolocator: ^13.0.4  # For location handling
  permission_handler: ^12.0.1  # For handling permissions
  adhan: ^2.0.0+1  # For prayer time calculations (offline support)
  flutter_svg: ^2.0.17  # For SVG support
  easy_localization: ^3.0.8  # For multi-language support
  shared_preferences: ^2.5.3  # For storing user preferences like manual location
  hijri: ^3.0.0  # For Hijri date calculations (complements adhan)
  intl: ^0.20.2  # For date and time formatting
  table_calendar: ^3.0.9
  geocoding: ^4.0.0
  flutter_qiblah: ^3.1.0+1
  google_maps_flutter: ^2.5.0
  location: ^5.0.3
#  flutter_compass: ^0.8.0
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.1
  dynamic_color: ^1.7.0
  http: ^1.6.0
  country_picker: ^2.0.27
  dio: ^5.9.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lang/en.json
    - assets/lang/bn.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
